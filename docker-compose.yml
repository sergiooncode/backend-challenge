version: '3'
services:
  landbot_challenge:
    image: landbot-challenge:latest
    build:
      context: .
      args:
        APP_ENV: 'local'
      dockerfile: ./Dockerfile
    stop_signal: SIGINT
    command: python ./src/manage.py runserver 0.0.0.0:8001
    ports:
      - "8001:8001"
    env_file:
      - .env.local
    volumes:
      - ./:/code
